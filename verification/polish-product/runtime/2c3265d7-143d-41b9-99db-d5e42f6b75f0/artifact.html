<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Polish Pi 产品验收</title><style>body{margin:0;background:#f5f6f8;color:#1f2329;font:16px/1.8 system-ui}main{max-width:850px;margin:36px auto;background:white;padding:40px;border:1px solid #dee0e3;border-radius:10px}h1{font-size:28px}h2{font-size:21px}section{margin:24px 0;padding:20px;border:1px solid #dee0e3;border-radius:8px}button{background:#3370ff;color:white;border:0;padding:8px 16px;border-radius:6px}input{padding:8px;border:1px solid #dee0e3;border-radius:5px}label{margin-right:20px}</style></head><body><main><h1 id="title">Polish Pi 产品验收</h1><p id="intro">通过当前 Pi 会话持续修订 HTML。</p><section id="summary"><h2 id="heading">同一 Pi 会话 · 第一轮已修订</h2><p id="description">这段说明需要简化。保留文字选区与内容块评论。</p><p id="details">第二段用于跨段选择。整体意见不关联任何网页元素。</p></section><section><h2>页面内表单</h2><form id="native-form"><label><input type="radio" name="verdict" value="yes">符合预期</label><label><input type="radio" name="verdict" value="no">需要调整</label><p><input name="note" placeholder="补充意见"></p><button type="submit">提交表单</button><span id="form-result"></span></form></section><a href="#summary">返回说明</a></main><script>document.getElementById('native-form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));window.lavish.queuePrompt('表单反馈：'+JSON.stringify(d),{scope:'session',data:d});window.lavish.sendQueuedPrompts();document.getElementById('form-result').textContent='已提交'};</script></body></html>
